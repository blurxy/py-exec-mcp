name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The whole point of this server is cross-platform interpreter resolution,
    # so the matrix is the test that matters most.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # No explicit `pytest ruff` here: naming them would rescue a broken [dev]
      # extra and hide exactly the defect this line is meant to catch.
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q

  legacy-sdk:
    # The matrix above always resolves the newest mcp, so it only ever exercises the
    # 2.x import. This job is the other half of the compat shim; without it, a change
    # that hardcoded the 2.x name would pass everything and break every 1.x user.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" "mcp<2"
      - run: python -c "import importlib.metadata as m; v = m.version('mcp'); print('mcp', v); assert v.startswith('1.'), v"
      - run: python -m pytest -q
