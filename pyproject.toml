[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-exec-mcp"
version = "0.1.0"
description = "Run Python from an MCP client with no shell quoting in the way"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "blurxy" }]
keywords = ["mcp", "model-context-protocol", "python", "claude", "llm", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# Both SDK majors work (2.x renamed FastMCP to MCPServer; server.py binds either).
# Capped at <3 because a third major has not been tested against.
dependencies = ["mcp>=1.2.0,<3"]

[project.urls]
Homepage = "https://github.com/blurxy/py-exec-mcp"
Issues = "https://github.com/blurxy/py-exec-mcp/issues"

[project.scripts]
py-exec-mcp = "py_exec_mcp.__main__:main"

# An extra, not a PEP 735 group: `pip install -e ".[dev]"` is what the README tells
# contributors to run, and a group needs `--group dev` on pip >= 25.1 to resolve at all.
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/py_exec_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
